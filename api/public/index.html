<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Deck Dashboard</title>
    <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-white dark:bg-black text-black dark:text-white mt-5">
    <section class="w-full h-full flex flex-col justify-items-start gap-30">
        <nav class="flex-row justify-evenly">
            <div class="flex flex-row items-center justify-between gap-20 mr-10 text-2xl font-spectral font-normal">
                <div class="ml-10">Flight Deck</div>
                <div class="flex flex-row items-center justify-end gap-20 text-2xl">
                    <p>Getting Started</p>
                    <p>Docs</p>
                    <p>Support</p>
                    <button class="bg-blue-600 pl-8 pr-8 pt-2 pb-2 rounded-[40px] text-white">Sign Up →</button>
                </div>
            </div>
        </nav>
        <div class="flex flex-row items-center justify-evenly">
            <div>
                <h1 class="font-zarathustra text-6xl">Flight Deck API</h1>
                <h3 class="font-zarathustra text-2xl w-108.75 mt-4">Open source API for METAR, Flights & other useful stuff</h3>
                <div class="flex flex-row gap-2 font-spectral">
                    <button class="bg-blue-600 pl-8 pr-8 pt-2 pb-2 mt-4 text-xl rounded-[40px] text-white">Get Started</button>
                    <button class="border-blue-600 border-2 border-dashed pl-8 pr-8 pt-2 pb-2 mt-4 text-xl rounded-[40px] text-blue-600 dark:text-white dark:border-white">View the docs</button>
                </div>
            </div>
            <div>
                <img class="w-75 rotate-10 rounded-2xl" src="https://cdn.hackclub.com/019fbad1-dcc9-72d7-99ad-f9395a615192/planeimg.jpg">
            </div>
        </div>
    </section>
</body>
</html>
